name: Fix CSV importer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: harden csv importer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch importer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/importers/documentParser.ts')
          s = p.read_text()

          helper = r'''function extractPnLValue(row: Record<string, any>): any {
            const keys = Object.keys(row);
            const exactAliases = [
              'net pnl','net p&l','net p/l','net profit','netprofit','closed pnl','closed p&l','closed p/l',
              'profit loss','profit/loss','realized pnl','realized profit','realized p/l','realized p&l',
              'pnl','p&l','p/l','profit','result','résultat','gain','perte','profit usd','pnl usd',
              'net pnl usd','profit eur','pnl eur','gross profit','gross loss'
            ];
            for (const alias of exactAliases) {
              const target = cleanKey(alias);
              const key = keys.find((k) => cleanKey(k) === target);
              if (key && parseNumericPnL(row[key]) !== null) return row[key];
            }
            let bestKey: string | undefined;
            let bestScore = 0;
            for (const key of keys) {
              const k = cleanKey(key);
              let score = 0;
              if (/netpnl|netpl|netprofit|closedpnl|closedpl|realizedpnl|realizedprofit/.test(k)) score += 120;
              else if (/profitloss|profitpl|profit|pnl|result|resultat|gain|perte/.test(k)) score += 80;
              if (/grossprofit|grossloss/.test(k)) score += 50;
              if (/balance|equity|amount|montant|volume|lots?|quantity|qty|price|open|close|entry|exit|commission|fee|swap|ticket|id/.test(k)) score -= 120;
              if (parseNumericPnL(row[key]) === null) score -= 100;
              if (score > bestScore) { bestScore = score; bestKey = key; }
            }
            return bestKey ? row[bestKey] : undefined;
          }

          if 'function extractPnLValue(' not in s:
              s = s.replace('function isSide(value: any): boolean {', helper + '\nfunction isSide(value: any): boolean {', 1)

          pattern = r"const pnlRaw = firstValue\(row, \[.*?'gross loss'\s*\]\);"
          s, count = re.subn(pattern, 'const pnlRaw = extractPnLValue(row);', s, flags=re.S)
          if count == 0:
              raise SystemExit('PnL declaration not found; refusing unsafe automatic patch')

          s = s.replace("const netPnL = parsedPnL ?? 0;", "const netPnL = parsedPnL ?? 0;\n  const pnlMissing = parsedPnL === null;", 1)
          s = s.replace("outcome,\n    killzone: finalSession,", "outcome,\n    notes: pnlMissing ? 'PnL non détecté dans le fichier importé — vérifier la colonne PnL.' : undefined,\n    killzone: finalSession,", 1)
          p.write_text(s)
          PY

      - name: Add parser regression tests
        run: |
          mkdir -p scripts
          cat > scripts/test-csv-importer.mjs <<'JS'
          const fs = await import('node:fs');
          const source = fs.readFileSync('src/importers/documentParser.ts', 'utf8');
          const required = [
            'function extractPnLValue',
            "'net pnl'",
            "'net profit'",
            "'realized pnl'",
            'parseNumericPnL',
          ];
          for (const token of required) {
            if (!source.includes(token)) throw new Error(`CSV importer regression: missing ${token}`);
          }
          if (/const pnlRaw = firstValue\(row, \[/.test(source)) throw new Error('CSV importer regression: legacy PnL selector still active');
          if (/amount.*pnl|pnl.*amount/i.test(source)) throw new Error('CSV importer regression: amount may be used as PnL');
          console.log('CSV importer static regression checks: OK');
          JS
          node scripts/test-csv-importer.mjs

      - name: Build and typecheck
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run build

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/importers/documentParser.ts scripts/test-csv-importer.mjs
          if git diff --cached --quiet; then echo 'No importer changes needed'; else git commit -m 'fix: harden csv importer'; git push; fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-csv-importer.yml
          git commit -m 'chore: remove temporary csv fix workflow'
          git push

name: Finalize Killzone terminology

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic Killzone fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, replacements):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text)

          # Fix the final naming collisions without changing persisted Trade.session storage.
          replace('src/lib/calculations/edge.ts', [
              ("    const session = t.session || 'Toutes';\n    const comboKey = `${setup}___${pair}___${killzone}`;", "    const killzone = t.session || 'Toutes les Killzones';\n    const comboKey = `${setup}___${pair}___${killzone}`;"),
              ("    const [setup, pair, session] = comboKey.split('___');", "    const [setup, pair, killzone] = comboKey.split('___');"),
              ("Generates an exhaustive breakdown across Setups, Pairs, Sessions", "Generates an exhaustive breakdown across Setups, Pairs, Killzones"),
              ("across Setups, Pairs, Sessions, Directions", "across Setups, Pairs, Killzones, Directions"),
              ("pendant la session ${topCombo.killzone}", "pendant la Killzone ${topCombo.killzone}"),
          ])

          replace('src/components/CreateTradeModal.tsx', [
              ("const [session, setKillzone] = useState<TradingKillzone>('LONDON');", "const [killzoneSessionValue, setKillzoneSessionValue] = useState<TradingKillzone>('LONDON');"),
              ("const [session, setSession] = useState<TradingKillzone>('LONDON');", "const [killzoneSessionValue, setKillzoneSessionValue] = useState<TradingKillzone>('LONDON');"),
              ("        session: killzone,", "        session: killzoneSessionValue,"),
              ("        session,", "        session: killzoneSessionValue,"),
              ("value={session}", "value={killzoneSessionValue}"),
              ("setSession(", "setKillzoneSessionValue("),
          ])

          replace('src/components/MyEdgeAnalyzerFeatures.tsx', [
              ('byKillzone.get(session)', 'byKillzone.get(killzone)'),
              ('byKillzone.set(session, bucket)', 'byKillzone.set(killzone, bucket)'),
              ('map(([session, cluster])', 'map(([killzone, cluster])'),
              ("analyzeCluster(cluster, session, session, 'Killzone')", "analyzeCluster(cluster, killzone, killzone, 'Killzone')"),
          ])

          replace('src/components/MyEdgeAnalyzerView.tsx', [
              ('map(([session,ts])', 'map(([killzone,ts])'),
              ('return{session,wr:', 'return{killzone,wr:'),
              ("bestKillzone(s,trades)?.session||'Killzone non déterminée'", "bestKillzone(s,trades)?.killzone||'Killzone non déterminée'"),
              ('pendant la session ${session}', 'pendant la Killzone ${killzone}'),
              ('<b>Killzone :</b> ${esc(session)}', '<b>Killzone :</b> ${esc(killzone)}'),
              ('Meilleure session', 'Meilleure Killzone'),
          ])

          replace('src/components/DashboardStatisticsSummary.tsx', [
              ("const session = bestDimension(closed, t => getTradeKillzone(t));", "const killzone = bestDimension(closed, t => getTradeKillzone(t));"),
              ('return { pair, session, day };', 'return { pair, killzone, day };'),
              ('data.session', 'data.killzone'),
              ('Meilleure session', 'Meilleure Killzone'),
          ])

          replace('src/components/MyEdgeView.tsx', [
              ("'period'|'symbol'|'setup'|'session'|'direction'|'result'", "'period'|'symbol'|'setup'|'killzone'|'direction'|'result'"),
              ("session:selectedKillzone", "killzone:selectedKillzone"),
              ("openFilter==='session'", "openFilter==='killzone'"),
          ])

          # Display terminology: preserve raw persisted enum values for compatibility.
          replace('src/lib/tradingKillzone.ts', [
              ("'Killzone London'", "'Killzone Londres'"),
              ("'London'", "'Killzone Londres'"),
              ("'New York'", "'Killzone New York'"),
              ("'Tokyo'", "'Killzone Asia'"),
          ])

          replace('src/components/TradeTable.tsx', [
              ("{trade.session || 'NO_SESSION'}", "{trade.session || 'Hors Killzone'}"),
          ])

          # Never rename the persisted DB field `session` or legacy sentinel `NO_SESSION`.
          print('Killzone finalizer applied.')
          PY

          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: finalize killzone terminology'
          git push origin main

name: Finish Killzone terminology

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish terminology migration
        shell: bash
        run: |
          set -euo pipefail
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/TradingSession/TradingKillzone/g; s/getTradeSession/getTradeKillzone/g; s/deriveTradingSession/deriveTradingKillzone/g; s/normalizedSessionForAudit/normalizedKillzoneForAudit/g; s/SESSION_LABELS/KILLZONE_LABELS/g; s/isMissingSession/isMissingKillzone/g; s/SetupPairSessionCombo/SetupPairKillzoneCombo/g; s/selectedSession/selectedKillzone/g; s/setSelectedSession/setSelectedKillzone/g; s/sessionBreakdown/killzoneBreakdown/g; s/sessionPerformances/killzonePerformances/g; s/sessionMap/killzoneMap/g; s/sessionStats/killzoneStats/g; s/sessionName/killzoneName/g; s/bestSession/bestKillzone/g; s/worstSession/worstKillzone/g; s/tradingSession/tradingKillzone/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bsessions\b/killzones/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bSession\b/Killzone/g; s/No session/No killzone/g; s/session performance/killzone performance/g; s/session killzones/killzone killzones/g; s/Londres \(London\)/Killzone Londres/g; s/\x27Killzone London\x27/\x27Killzone Londres\x27/g; s/Tokyo \(Asie\)/Killzone Asia/g; s/\x27Tokyo\x27/\x27Killzone Asia\x27/g'
          find src/components -type f -name '*.tsx' -print0 | xargs -0 perl -pi -e 's/\bconst session =/const killzone =/g; s/\bbySession\b/byKillzone/g; s/\bleftSession\b/leftKillzone/g; s/\brightSession\b/rightKillzone/g; s/\bsessionName\b/killzoneName/g; s/\bsessionStats\b/killzoneStats/g; s/\bsessionBreakdown\b/killzoneBreakdown/g; s/\bsessionMap\b/killzoneMap/g; s/\bsessionPerformances\b/killzonePerformances/g; s/\bsession\b(?=\s*=\s*bestKillzone)/killzone/g'
          find src/lib/calculations/edge.ts src/components/MyEdgeView.tsx -type f -print0 | xargs -0 perl -pi -e 's/\bsession:\s*string;/killzone: string;/g; s/\.session\b/.killzone/g; s/\bsession\b(?=\s*\})/killzone/g; s/\bsession\b(?=\s*\,)/killzone/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bt\.killzone\b/t.session/g; s/\btrade\.killzone\b/trade.session/g; s/\binput\.killzone\b/input.session/g'
          perl -pi -e 's/\bsessions\b/killzones/g; s/\bsession:\s*t\.session\b/killzone: t.session/g' src/lib/coachContext.ts
          perl -pi -e "s/\{trade\.session \|\| 'NO_SESSION'\}/\{trade.session || 'Hors Killzone'\}/g" src/components/TradeTable.tsx
          echo '--- Remaining old business identifiers ---'
          git grep -nE '\bTradingSession\b|\btradingSession\b|getTradeSession|deriveTradingSession|normalizedSessionForAudit|selectedSession|sessionBreakdown|sessionPerformances|sessionMap|bestSession|worstSession|SetupPairSessionCombo' -- src || true
          echo '--- Remaining user-facing Session/session occurrences ---'
          git grep -nE 'Session|session' -- src/components src/lib src/types | grep -vE 'trade\.session|t\.session|input\.session|Trade\[.session.|session:|NO_SESSION|\.stores\(|session killzone|session liquidity' || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm -f .github/workflows/finish-killzone-terminology.yml
          git commit -m 'refactor: complete killzone terminology migration'
          git push origin main

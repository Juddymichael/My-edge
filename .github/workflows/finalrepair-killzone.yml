name: Final Killzone repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Repair and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,pairs):
              p=Path(path); t=p.read_text(); o=t
              for a,b in pairs: t=t.replace(a,b)
              if t!=o: p.write_text(t)
          replace('src/tests/riskPatterns.test.ts',[("session:null,timeframe:'M15'","session:killzone==='LONDON_OPEN'?'LONDON':killzone==='OFF_HOURS'?'OFF_HOURS':null,timeframe:'M15'")])
          replace('src/lib/riskPatterns.ts',[("t.session==='Hors Killzone'||t.session==='NO_SESSION'","t.session==='OFF_HOURS'")])
          replace('src/types/trade.ts',[("'NEW_YORK' | 'CUSTOM' |","'NEW_YORK' | 'OFF_HOURS' | 'CUSTOM' |")])
          replace('src/components/CreateTradeModal.tsx',[("const [session, setSession]","const [killzoneValue, setKillzoneValue]"),("        session,","        session: killzoneValue,"),("value={session}","value={killzoneValue}"),("setSession(","setKillzoneValue("),("Killzone Killzone","Killzone")])
          replace('src/components/MyEdgeAnalyzerFeatures.tsx',[("byKillzone.get(session)","byKillzone.get(killzone)"),("byKillzone.set(session, bucket)","byKillzone.set(killzone, bucket)"),("map(([session, cluster])","map(([killzone, cluster])"),("analyzeCluster(cluster, session, session, 'Killzone')","analyzeCluster(cluster, killzone, killzone, 'Killzone')"),("Meilleure session","Meilleure Killzone")])
          replace('src/components/MyEdgeAnalyzerView.tsx',[("map(([session,ts])","map(([killzone,ts])"),("return{session,wr:","return{killzone,wr:"),("bestKillzone(s,trades)?.session||'Killzone non déterminée'","bestKillzone(s,trades)?.killzone||'Killzone non déterminée'"),("pendant la session ${session}","pendant la Killzone ${killzone}"),("<b>Killzone :</b> ${esc(session)}","<b>Killzone :</b> ${esc(killzone)}")])
          replace('src/components/AIAnalysisView.tsx',[("Performance par session","Performance par Killzone"),("../lib/tradingSession","../lib/tradingKillzone")])
          replace('src/components/DashboardStatisticsSummary.tsx',[("../lib/tradingSession","../lib/tradingKillzone"),("const session = bestDimension(closed, t => getTradeKillzone(t));","const killzone = bestDimension(closed, t => getTradeKillzone(t));"),("return { pair, session, day };","return { pair, killzone, day };")])
          replace('src/components/AnalyticsView.tsx',[("{s.session}","{s.killzone}"),("../lib/tradingSession","../lib/tradingKillzone")])
          replace('src/lib/calculations/edge.ts',[("const [setup, pair, session] = comboKey.split('___');","const [setup, pair, killzone] = comboKey.split('___');"),("pendant la session ${topCombo.killzone}","pendant la Killzone ${topCombo.killzone}"),("across Setups, Pairs, Sessions, Directions","across Setups, Pairs, Killzones, Directions"),("const eligibleSessions =","const eligibleKillzones ="),("eligibleSessions","eligibleKillzones")])
          replace('src/lib/coachContext.ts',[(".topCombination.session",".topCombination.killzone"),("Sessions Breakdown","Killzones Breakdown")])
          replace('src/lib/validation/quality.ts',[("Trading session unassigned","Trading killzone unassigned")])
          replace('src/types/setup.ts',[("active session killzone","active killzone"),("key session or daily level","key killzone or daily level")])
          replace('src/types/settings.ts',[("export interface SessionConfig","export interface KillzoneConfig")])
          replace('src/lib/validation/settingsSchema.ts',[("SessionHoursSchema","KillzoneHoursSchema")])
          for p in Path('src').rglob('*'):
              if p.suffix in {'.ts','.tsx'}:
                  t=p.read_text(); u=t.replace('/lib/tradingSession','/lib/tradingKillzone')
                  if u!=t:p.write_text(u)
          PY
          git diff --check
          bun install --frozen-lockfile
          bun run test -- --run src/tests/importRobustness.test.ts src/tests/riskPatterns.test.ts src/tests/myEdgeAnalyzerFeatures.test.ts src/tests/tradingSession.test.ts src/tests/dashboardDataIntegrity.test.ts
          bun run lint
          bun run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm -f .github/workflows/finalrepair-killzone.yml .github/workflows/validate-killzone-final.yml .github/workflows/validate-killzone-terminology.yml .github/workflows/repair-killzone.yml || true
          git commit -m 'fix: finalize killzone terminology migration'
          git push origin main

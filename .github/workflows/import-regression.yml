name: Import, AI Analysis and Risk regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run tsc -- --noEmit
      - run: bun run lint
      - run: bun run test -- --run src/tests/importRegression.test.ts src/tests/aiAnalysis.test.ts src/tests/tradingSession.test.ts src/tests/dashboardDataIntegrity.test.ts

name: Import, Coach and Risk regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run src/tests/importRobustness.test.ts src/tests/coachPersistence.test.ts src/tests/coachTools.test.ts src/tests/riskPatterns.test.ts
      - run: npm run lint

name: Import, AI Analysis and Risk regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply Killzone terminology fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def r(path,pairs):
              p=Path(path); t=p.read_text(); o=t
              for a,b in pairs:t=t.replace(a,b)
              if t!=o:p.write_text(t)
          r('src/lib/calculations/edge.ts',[("const [setup, pair, session] = comboKey.split('___');","const [setup, pair, killzone] = comboKey.split('___');")])
          r('src/components/CreateTradeModal.tsx',[("const [session, setSession]","const [killzoneSessionValue, setKillzoneSessionValue]"),("        session,","        session: killzoneSessionValue,"),("value={session}","value={killzoneSessionValue}"),("setSession(","setKillzoneSessionValue("),("Killzone Killzone","Killzone")])
          r('src/components/MyEdgeAnalyzerFeatures.tsx',[("byKillzone.get(session)","byKillzone.get(killzone)"),("byKillzone.set(session, bucket)","byKillzone.set(killzone, bucket)"),("map(([session, cluster])","map(([killzone, cluster])"),("analyzeCluster(cluster, session, session, 'Killzone')","analyzeCluster(cluster, killzone, killzone, 'Killzone')"),("Meilleure session","Meilleure Killzone")])
          r('src/components/MyEdgeAnalyzerView.tsx',[("map(([session,ts])","map(([killzone,ts])"),("return{session,wr:","return{killzone,wr:"),("bestKillzone(s,trades)?.session||'Killzone non déterminée'","bestKillzone(s,trades)?.killzone||'Killzone non déterminée'"),("pendant la session ${session}","pendant la Killzone ${killzone}"),("<b>Killzone :</b> ${esc(session)}","<b>Killzone :</b> ${esc(killzone)}")])
          r('src/components/DashboardStatisticsSummary.tsx',[("const session = bestDimension(closed, t => getTradeKillzone(t));","const killzone = bestDimension(closed, t => getTradeKillzone(t));"),("return { pair, session, day };","return { pair, killzone, day };")])
          r('src/components/MyEdgeView.tsx',[("'period'|'symbol'|'setup'|'session'|'direction'|'result'","'period'|'symbol'|'setup'|'killzone'|'direction'|'result'"),("session:selectedKillzone","killzone:selectedKillzone"),("openFilter==='session'","openFilter==='killzone'")])
          r('src/components/AIAnalysisView.tsx',[("Performance par session","Performance par Killzone")])
          r('src/components/AnalyticsView.tsx',[("{s.session}","{s.killzone}")])
          r('src/lib/coachContext.ts',[(".topCombination.session",".topCombination.killzone"),("Sessions Breakdown","Killzones Breakdown")])
          r('src/lib/validation/quality.ts',[("Trading session unassigned","Trading killzone unassigned")])
          r('src/types/setup.ts',[("active session killzone","active killzone"),("key session or daily level","key killzone or daily level")])
          r('src/types/settings.ts',[("export interface SessionConfig","export interface KillzoneConfig")])
          r('src/lib/validation/settingsSchema.ts',[("SessionHoursSchema","KillzoneHoursSchema")])
          r('src/lib/riskPatterns.ts',[("t.session==='Hors Killzone'||t.session==='NO_SESSION'","t.session==='OFF_HOURS'")])
          r('src/tests/riskPatterns.test.ts',[("session:null,timeframe:'M15'","session:killzone==='LONDON_OPEN'?'LONDON':killzone==='OFF_HOURS'?'OFF_HOURS':null,timeframe:'M15'")])
          r('src/types/trade.ts',[("'NEW_YORK' | 'CUSTOM' |","'NEW_YORK' | 'OFF_HOURS' | 'CUSTOM' |")])
          r('src/components/TradeTable.tsx',[("trade.session || 'NO_SESSION'","trade.session || 'Hors Killzone'")])
          for p in Path('src').rglob('*'):
              if p.suffix in {'.ts','.tsx'}:
                  t=p.read_text(); u=t.replace('/lib/tradingSession','/lib/tradingKillzone')
                  if u!=t:p.write_text(u)
          PY
          git diff --check
          bun install --frozen-lockfile
          bun run test -- --run src/tests/importRobustness.test.ts src/tests/riskPatterns.test.ts src/tests/myEdgeAnalyzerFeatures.test.ts src/tests/tradingSession.test.ts src/tests/dashboardDataIntegrity.test.ts
          bun run lint
          bun run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'refactor: complete killzone terminology migration'
          git push origin main

name: Killzone terminology migration

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename Session terminology to Killzone
        shell: bash
        run: |
          set -euo pipefail
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/TradingSession/TradingKillzone/g; s/getTradeSession/getTradeKillzone/g; s/deriveTradingSession/deriveTradingKillzone/g; s/normalizedSessionForAudit/normalizedKillzoneForAudit/g; s/SESSION_LABELS/KILLZONE_LABELS/g; s/isMissingSession/isMissingKillzone/g; s/SetupPairSessionCombo/SetupPairKillzoneCombo/g; s/selectedSession/selectedKillzone/g; s/setSelectedSession/setSelectedKillzone/g; s/sessionBreakdown/killzoneBreakdown/g; s/sessionPerformances/killzonePerformances/g; s/sessionMap/killzoneMap/g; s/sessionStats/killzoneStats/g; s/sessionName/killzoneName/g; s/bestSession/bestKillzone/g; s/worstSession/worstKillzone/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/AnalyticsSubTab = '\''overview'\'' \| '\''setups'\'' \| '\''sessions'\''/AnalyticsSubTab = '\''overview'\'' | '\''setups'\'' | '\''killzones'\''/g; s/EdgeTab = '\''verdict'\'' \| '\''combos'\'' \| '\''setups'\'' \| '\''pairs'\'' \| '\''sessions'\''/EdgeTab = '\''verdict'\'' | '\''combos'\'' | '\''setups'\'' | '\''pairs'\'' | '\''killzones'\''/g; s/setActiveTab\('\''sessions'\''\)/setActiveTab('\''killzones'\'')/g; s/activeTab === '\''sessions'\''/activeTab === '\''killzones'\''/g; s/\bsessions:\s*DimensionPerformance\[\]/killzones: DimensionPerformance[]/g; s/\bsessions:\s*sessionPerformances\b/killzones: killzonePerformances/g; s/\bsessions\b/killzones/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bsession:\s*string;/killzone: string;/g; s/\bsession:\s*killzoneName\b/killzone: killzoneName/g; s/\bsession:\s*killzone\b/killzone: killzone/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/Setup \/ Session/Setup \/ Killzone/g; s/Performance par Session de Marché/Performance par Killzone/g; s/Performance par session/Performance par Killzone/g; s/Performance par Session/Performance par Killzone/g; s/Par Session/Par Killzone/g; s/Toutes les sessions/Toutes les Killzones/g; s/Meilleure Session/Meilleure Killzone/g; s/Session la plus rentable/Killzone la plus rentable/g; s/Session non déterminée/Killzone non déterminée/g; s/pendant la session/pendant la Killzone/g; s/<b>Session :/<b>Killzone :/g; s/Killzone London/Killzone Londres/g; s/Tokyo \(Asie\)/Killzone Asia/g; s/Londres \(London\)/Killzone Londres/g; s/New York/Killzone New York/g; s/Sydney/Killzone Sydney/g'
          find src/components -type f -name '*.tsx' -print0 | xargs -0 perl -pi -e 's/\bconst session =/const killzone =/g; s/\[session,ts\]/[killzone,ts]/g; s/\bsessionBreakdown\b/killzoneBreakdown/g; s/\bsessionName\b/killzoneName/g; s/\bsessionStats\b/killzoneStats/g; s/\bsessionPerformances\b/killzonePerformances/g; s/\bsessionMap\b/killzoneMap/g; s/\bbestSession\b/bestKillzone/g; s/\bworstSession\b/worstKillzone/g'
          find src/lib/coachContext.ts -type f -print0 | xargs -0 perl -pi -e 's/\bsessions\b/killzones/g; s/\bsession:\s*string\b/killzone: string/g; s/\bsession:\s*s\.label\b/killzone: s.label/g'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/tradingSession/tradingKillzone/g; s/TradingSession/TradingKillzone/g; s/getTradeSession/getTradeKillzone/g; s/deriveTradingSession/deriveTradingKillzone/g; s/normalizedSessionForAudit/normalizedKillzoneForAudit/g; s/SESSION_LABELS/KILLZONE_LABELS/g; s/selectedSession/selectedKillzone/g; s/sessionBreakdown/killzoneBreakdown/g; s/sessionStats/killzoneStats/g; s/sessionPerformances/killzonePerformances/g; s/\bsessions\b/killzones/g'
          if [ -f src/tests/tradingSession.test.ts ]; then mv src/tests/tradingSession.test.ts src/tests/tradingKillzone.test.ts; fi
          perl -pi -e 's/src\/tests\/tradingSession\.test\.ts/src\/tests\/tradingKillzone.test.ts/g' .github/workflows/import-regression.yml
          if [ -f src/lib/tradingSession.ts ]; then mv src/lib/tradingSession.ts src/lib/tradingKillzone.ts; fi
          echo '--- Legacy persisted storage references (intentional) ---'
          git grep -n 'NO_SESSION' -- src || true
          echo '--- Remaining Session/session business references ---'
          git grep -nE '\bSession\b|\bsession\b|TradingSession|tradingSession|getTradeSession|deriveTradingSession|selectedSession|sessionBreakdown|bestSession|worstSession' -- src || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/import-regression.yml
          git rm -f .github/workflows/terminology-killzone.yml
          git commit -m 'refactor: rename trading sessions to killzones'
          git push origin main

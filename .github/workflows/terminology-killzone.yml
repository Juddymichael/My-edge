name: Killzone terminology migration

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename Session terminology to Killzone
        shell: bash
        run: |
          set -euo pipefail
          # Business-code identifiers; persisted Trade.session and legacy NO_SESSION remain compatible.
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/TradingSession/TradingKillzone/g; s/getTradeSession/getTradeKillzone/g; s/deriveTradingSession/deriveTradingKillzone/g; s/normalizedSessionForAudit/normalizedKillzoneForAudit/g; s/SESSION_LABELS/KILLZONE_LABELS/g; s/isMissingSession/isMissingKillzone/g; s/SetupPairSessionCombo/SetupPairKillzoneCombo/g; s/selectedSession/selectedKillzone/g; s/setSelectedSession/setSelectedKillzone/g; s/sessionBreakdown/killzoneBreakdown/g; s/sessionPerformances/killzonePerformances/g; s/sessionMap/killzoneMap/g; s/sessionStats/killzoneStats/g; s/sessionName/killzoneName/g; s/bestSession/bestKillzone/g; s/worstSession/worstKillzone/g; s/sessionsList/killzonesList/g'
          # Rename the analytics dimension without renaming the persisted Trade.session field.
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bsessions:\s*DimensionPerformance\[\]/killzones: DimensionPerformance[]/g; s/\bsessions:\s*sessionPerformances\b/killzones: killzonePerformances/g; s/\bsessions\b/killzones/g'
          # Local combo payload properties are business terminology, not database schema.
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bsession:\s*string;/killzone: string;/g; s/\bsession:\s*killzoneName\b/killzone: killzoneName/g; s/\bsession:\s*killzone\b/killzone: killzone/g'
          # User-facing wording and documentation.
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/\bSession\b/Killzone/g; s/No session/No killzone/g; s/session performance/killzone performance/g; s/session killzones/killzone killzones/g; s/Londres \(London\)/Killzone Londres/g; s/\x27Killzone London\x27/\x27Killzone Londres\x27/g; s/Tokyo \(Asie\)/Killzone Asia/g; s/\x27Tokyo\x27/\x27Killzone Asia\x27/g; s/\x27SYDNEY\x27/\x27Killzone Sydney\x27/g'
          # Local killzone variables used by analyzer views.
          find src/components -type f -name '*.tsx' -print0 | xargs -0 perl -pi -e 's/\bconst session =/const killzone =/g; s/\bsessionBreakdown\b/killzoneBreakdown/g; s/\bsessionName\b/killzoneName/g; s/\bsessionStats\b/killzoneStats/g; s/\bsessionPerformances\b/killzonePerformances/g; s/\bsessionMap\b/killzoneMap/g; s/\bbestSession\b/bestKillzone/g; s/\bworstSession\b/worstKillzone/g'
          # AI context payload is internal business logic, so rename its killzone dimension too.
          find src/lib/coachContext.ts -type f -print0 | xargs -0 perl -pi -e 's/\bsessions\b/killzones/g; s/\bsession:\s*string\b/killzone: string/g; s/\bsession:\s*s\.label\b/killzone: s.label/g; s/\bbestSession\b/bestKillzone/g; s/\bworstSession\b/worstKillzone/g'
          # Rename helper filename; the persisted Trade.session field itself is deliberately unchanged.
          if [ -f src/lib/tradingSession.ts ]; then mv src/lib/tradingSession.ts src/lib/tradingKillzone.ts; fi
          # Keep the existing regression-test filename so the existing workflow contract stays intact.
          echo '--- Legacy persisted storage references (intentional) ---'
          git grep -n 'NO_SESSION' -- src || true
          echo '--- Remaining Session/session business references ---'
          git grep -nE '\bTradingSession\b|\btradingSession\b|getTradeSession|deriveTradingSession|normalizedSessionForAudit|selectedSession|sessionBreakdown|bestSession|worstSession' -- src || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm -f .github/workflows/terminology-killzone.yml
          git commit -m 'refactor: rename trading sessions to killzones'
          git push origin main
